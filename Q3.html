<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3</title>
</head>
<body>

    <p id="demo"></p>

    <script>
        let text = "";

        // Loop runs from i = 0 up to 4; (i + 1) outputs 1 to 5 with line breaks
        for (let i = 0; i < 5; i++) {
            text += "The number is " + (i + 1) + "<br>";
        }

        document.getElementById("demo").innerHTML = text;
    </script>

</body>
</html>
